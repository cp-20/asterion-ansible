server {
    listen 3000;
    listen 4173;
    server_name _;
    charset utf-8;
    server_tokens off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Also retire API paths routed through the old web or Swagger port.
    location ~* ^/api(?:/|$) {
        default_type application/json;
        return 410 '{"message":"ReadStack has ended service."}';
    }

    location / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
}

server {
    listen 8000;
    server_name _;
    server_tokens off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 410 '{"message":"ReadStack has ended service."}';
}
