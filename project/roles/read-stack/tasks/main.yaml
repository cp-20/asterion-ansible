---
- name: Create service-ended page directory
  ansible.builtin.file:
    path: /srv/read-stack-retired
    state: directory
    mode: '0755'

- name: Copy service-ended page and configuration
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/srv/read-stack-retired/{{ item }}'
    mode: '0644'
  loop:
    - index.html
    - default.conf
    - compose.yaml
  register: read_stack_static_files

- name: Serve the service-ended page
  community.docker.docker_compose_v2:
    project_src: /srv/read-stack-retired
    project_name: read-stack-retired
    state: present
    recreate: "{{ 'always' if read_stack_static_files.changed else 'auto' }}"
